<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CalcBhai - Free Online Calculators</title>
  <meta name="description" content="Free online EMI, percentage, GST and other useful calculators.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
    }

    header p {
      margin-top: 8px;
      color: #d1d5db;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 15px;
    }

    .hero {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .hero h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #666;
    }

    .calculator {
      margin-top: 25px;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    .calculator h2 {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      background: #eef2ff;
      border-radius: 10px;
      display: none;
    }

    .result strong {
      font-size: 24px;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }
  </style>
</head>

<body>

<header>
  <h1>CalcBhai 🧮</h1>
  <p>Free Online Calculators</p>
</header>

<div class="container">

  <section class="hero">
    <h2>Calculate Anything Easily</h2>
    <p>Fast, simple and free calculators for everyday use.</p>
  </section>

  <section class="calculator">

    <h2>EMI Calculator</h2>

    <label>Loan Amount (₹)</label>
    <input type="number" id="loan" placeholder="Example: 500000">

    <label>Annual Interest Rate (%)</label>
    <input type="number" id="rate" placeholder="Example: 8.5">

    <label>Loan Tenure (Years)</label>
    <input type="number" id="years" placeholder="Example: 5">

    <button onclick="calculateEMI()">Calculate EMI</button>

    <div class="result" id="result">
      <p>Monthly EMI</p>
      <strong id="emi">₹0</strong>
      <br><br>
      <p>Total Interest: <span id="interest">₹0</span></p>
      <p>Total Payment: <span id="total">₹0</span></p>
    </div>

  </section>

</div>

<footer>
  © 2026 CalcBhai • Free Online Tools
</footer>

<script>

function calculateEMI() {

  let loan = Number(document.getElementById("loan").value);
  let annualRate = Number(document.getElementById("rate").value);
  let years = Number(document.getElementById("years").value);

  if (loan <= 0 || annualRate < 0 || years <= 0) {
    alert("Please enter valid values.");
    return;
  }

  let months = years * 12;
  let monthlyRate = annualRate / 12 / 100;

  let emi;

  if (monthlyRate === 0) {
    emi = loan / months;
  } else {
    emi =
      loan *
      monthlyRate *
      Math.pow(1 + monthlyRate, months) /
      (Math.pow(1 + monthlyRate, months) - 1);
  }

  let totalPayment = emi * months;
  let totalInterest = totalPayment - loan;

  document.getElementById("emi").innerText =
    "₹" + emi.toLocaleString("en-IN", {
      maximumFractionDigits: 0
    });

  document.getElementById("interest").innerText =
    "₹" + totalInterest.toLocaleString("en-IN", {
      maximumFractionDigits: 0
    });

  document.getElementById("total").innerText =
    "₹" + totalPayment.toLocaleString("en-IN", {
      maximumFractionDigits: 0
    });

  document.getElementById("result").style.display = "block";
}

</script>

</body>
</html>
